spring.application.name=ms-vinculacion
server.port=9092

spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/bd_albalab_vinculacion?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Mismo secreto que ms-admin y api-gateway (variable de entorno SECRET). Valor por defecto solo para desarrollo local.
jwt.secret=${SECRET:albalab-clave-solo-desarrollo-local-0123456789}
