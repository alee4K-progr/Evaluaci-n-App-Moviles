spring.application.name=ms-contenidos
server.port=9091

spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/bd_albalab_contenidos?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Carga contenidos FICTICIOS de demostracion si las tablas estan vacias.
albalab.seed-contenidos=true
