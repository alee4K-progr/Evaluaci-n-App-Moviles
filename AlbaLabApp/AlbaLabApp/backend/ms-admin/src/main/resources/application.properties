spring.application.name=ms-admin
server.port=9093

# Base de datos propia del servicio (MySQL). Con Docker se usa host.docker.internal como en el ejemplo del profe.
spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/bd_albalab_admin?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Secreto JWT compartido con el api-gateway (variable de entorno SECRET, minimo 32 caracteres).
# El valor por defecto es SOLO para desarrollo local.
jwt.secret=${SECRET:albalab-clave-solo-desarrollo-local-0123456789}
jwt.expiracion-minutos=480

# Crea usuarios FICTICIOS de demostracion si la tabla esta vacia.
albalab.seed-usuarios=true
